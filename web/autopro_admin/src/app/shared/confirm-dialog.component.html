@if (open()) {
  <div class="confirm-backdrop" role="presentation" (click)="onBackdropClick()">
    <div
      class="confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="'confirm-dialog-title'"
      (click)="stopClick($event)"
    >
      <header class="confirm-dialog__header">
        <h2 class="confirm-dialog__title" id="confirm-dialog-title">{{ title() }}</h2>
      </header>

      <div class="confirm-dialog__body">
        <ng-content />
      </div>

      <footer class="confirm-dialog__actions">
        <button type="button" class="ghost" (click)="cancelled.emit()" [disabled]="confirmDisabled()">
          {{ cancelLabel() }}
        </button>
        <button
          type="button"
          class="btn-primary"
          [class.btn-primary--danger]="confirmDanger()"
          (click)="confirmed.emit()"
          [disabled]="confirmDisabled()"
        >
          {{ confirmLabel() }}
        </button>
      </footer>
    </div>
  </div>
}
