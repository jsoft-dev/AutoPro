services:
  postgres:
    image: postgres:16-alpine
    container_name: autopro-postgres
    environment:
      POSTGRES_USER: autopro
      POSTGRES_PASSWORD: autopro_dev
      POSTGRES_DB: autopro
    ports:
      - "5432:5432"
    volumes:
      - autopro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopro -d autopro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autopro_pg_data:
