# $0 demo: Neon Postgres (free, no expiry) + Render API (Docker) + WebApp static site.
# Do not add Render's free Postgres here — it expires after ~30 days.
services:
  - type: web
    name: autopro-api
    runtime: docker
    plan: free
    healthCheckPath: /swagger/index.html
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: EnableSwagger
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SigningKey
        generateValue: true

  - type: web
    name: autopro-admin
    runtime: static
    rootDir: web/autopro_admin
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist/autopro-admin/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        value: https://autopro-api-6mkp.onrender.com
